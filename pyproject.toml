[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "joshchen61-e2econsist"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "joshchen61" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://joshchen61.github.io"
Repository = "https://github.com/joshchen61/e2econsist"
Issues = "https://github.com/joshchen61/e2econsist/issues"

[project.scripts]
e2econsist = "e2econsist:main"

[tool.setuptools]
py-modules = ["e2econsist"]
